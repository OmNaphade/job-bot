# Local Postgres + pgvector for development and tests. Not used in production --
# VM2 runs its own Postgres install directly (see deploy/oci_deploy_db.sh),
# not this container. Start with: docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: job_alert
      POSTGRES_PASSWORD: job_alert
      POSTGRES_DB: job_alert
    ports:
      # Mapped to a non-default host port so this doesn't collide with any
      # Postgres already running locally on 5432.
      - "5433:5432"
    volumes:
      - job_alert_pgdata:/var/lib/postgresql/data
      - ./scripts/init_test_db.sql:/docker-entrypoint-initdb.d/init_test_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_alert"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  job_alert_pgdata:

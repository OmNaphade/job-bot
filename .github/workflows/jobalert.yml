name: Job alert

on:
  schedule:
    # Twice an hour at :17 and :47. GitHub is busiest at :00 and :30, where scheduled runs get delayed
    # or dropped, so these off-peak minutes are more reliable. Public repo = unlimited Actions minutes.
    # (If you ever go private, switch to hourly: 2,000 free minutes a month won't cover this.)
    - cron: "17,47 * * * *"
  workflow_dispatch: {}

concurrency:
  group: jobalert
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # What has already been alerted lives on its own `state` branch, so main stays clean.
      - name: Restore state
        run: |
          mkdir -p data
          if git fetch --depth=1 origin state 2>/dev/null; then
            git show FETCH_HEAD:state.json > data/state.json
          fi

      - name: Check for new jobs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_EMAIL_ADDRESS: ${{ secrets.ALERT_EMAIL_ADDRESS }}
          ALERT_EMAIL_APP_PASSWORD: ${{ secrets.ALERT_EMAIL_APP_PASSWORD }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: python -m jobalert run

      # always(): even a run that errored late keeps the jobs it already alerted on from repeating.
      - name: Save state
        if: always()
        run: |
          [ -f data/state.json ] || exit 0
          cp data/state.json "$RUNNER_TEMP/state.json"
          git config user.name "job-alert"
          git config user.email "job-alert@users.noreply.github.com"
          if git fetch --depth=1 origin state 2>/dev/null; then
            git checkout -q -B state FETCH_HEAD
          else
            git checkout -q --orphan state
            git rm -rf -q .
          fi
          cp "$RUNNER_TEMP/state.json" state.json
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -q -m "state $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:state

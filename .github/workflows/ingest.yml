name: Scheduled ingestion

on:
  schedule:
    # Hourly (24 runs/day) -- frequent enough to feel responsive for active
    # job hunting without relying on sub-hourly cron, which GitHub's own docs
    # warn is prone to delay/skipping under load. GitHub may still delay
    # scheduled runs under load; this is a best-effort cadence, not a guarantee.
    - cron: "17 * * * *"
  workflow_dispatch: {}

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt

      # Pinned exact versions, not the requirements.txt ranges -- this workflow
      # runs unattended every hour with nobody watching it fail; see the header
      # comment in requirements-lock.txt for why this differs from ci.yml.
      - name: Install dependencies
        run: pip install -r requirements-lock.txt

      - name: Run one ingestion pass
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_EMAIL_ADDRESS: ${{ secrets.ALERT_EMAIL_ADDRESS }}
          ALERT_EMAIL_APP_PASSWORD: ${{ secrets.ALERT_EMAIL_APP_PASSWORD }}
          ALERT_EMAIL_IMAP_HOST: ${{ secrets.ALERT_EMAIL_IMAP_HOST }}
          ALERT_EMAIL_IMAP_PORT: ${{ secrets.ALERT_EMAIL_IMAP_PORT }}
          LINKEDIN_ALERT_SENDER: ${{ secrets.LINKEDIN_ALERT_SENDER }}
          NAUKRI_ALERT_SENDER: ${{ secrets.NAUKRI_ALERT_SENDER }}
          LINKEDIN_ALERT_LABEL: ${{ secrets.LINKEDIN_ALERT_LABEL }}
          NAUKRI_ALERT_LABEL: ${{ secrets.NAUKRI_ALERT_LABEL }}
          WEWORKREMOTELY_FEED_URL: ${{ secrets.WEWORKREMOTELY_FEED_URL }}
          HIMALAYAS_FEED_URL: ${{ secrets.HIMALAYAS_FEED_URL }}
          REMOTIVE_FEED_URL: ${{ secrets.REMOTIVE_FEED_URL }}
          NODESK_FEED_URL: ${{ secrets.NODESK_FEED_URL }}
          JOBSPRESSO_FEED_URL: ${{ secrets.JOBSPRESSO_FEED_URL }}
          REMOTEOK_API_URL: ${{ secrets.REMOTEOK_API_URL }}
          GREENHOUSE_BOARD_TOKENS: ${{ secrets.GREENHOUSE_BOARD_TOKENS }}
          LEVER_COMPANY_SLUGS: ${{ secrets.LEVER_COMPANY_SLUGS }}
          ASHBY_BOARD_NAMES: ${{ secrets.ASHBY_BOARD_NAMES }}
          FOUNDIT_SEARCH_QUERIES: ${{ secrets.FOUNDIT_SEARCH_QUERIES }}
          FOUNDIT_SEARCH_LOCATIONS: ${{ secrets.FOUNDIT_SEARCH_LOCATIONS }}
          FOUNDIT_SEARCH_COUNTRIES: ${{ secrets.FOUNDIT_SEARCH_COUNTRIES }}
        run: python -m scripts.run_ingestion_once

      # always() so a failed run's history (already recorded to job_alert.db by
      # IngestionService before it re-raised) still gets committed and is visible
      # on GitHub -- not just success runs.
      - name: Commit updated database if it changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add job_alert.db
          git diff --cached --quiet && exit 0
          git commit -m "chore: ingestion run $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
          # The `concurrency` group above serializes scheduled runs against each
          # other, but a manual local push (per OPERATIONS.md's documented
          # workflow) landing between this job's checkout and its push would
          # otherwise make a plain `git push` fail outright and drop this run's
          # DB update. Rebase onto whatever's on origin now before pushing.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
